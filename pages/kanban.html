<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Board | CollabHub</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/navbar.css">
  <link rel="stylesheet" href="../css/buttons.css">
  <link rel="stylesheet" href="../css/forms.css">
  <link rel="stylesheet" href="../css/modal.css">
</head>
<body>
  <header class="navbar">
    <button class="navbar__toggle" aria-label="Toggle menu">&#9776;</button>
    <div class="navbar__brand">CollabHub</div>
    <nav class="navbar__nav">
      <a href="dashboard.html" class="navbar__link">Dashboard</a>
      <a href="kanban.html" class="navbar__link navbar__link--active">Task Board</a>
      <a href="settings.html" class="navbar__link">Settings</a>
    </nav>
    <button class="btn btn--primary" data-modal-open="new-task-modal">+ New Task</button>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <ul class="sidebar__list">
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="kanban.html">Task Board</a></li>
        <li><a href="settings.html">Settings</a></li>
      </ul>
    </aside>

    <div class="board">
      <div class="kanban-toolbar">
        <input type="search" id="task-filter" placeholder="Filter tasks...">
      </div>

      <main class="kanban">
        <section class="kanban__column" data-status="todo">
          <h3>To-Do <span class="kanban__count">0</span></h3>
          <article class="kanban__card">Design login page <span class="tag tag--high">High</span></article>
          <article class="kanban__card">Set up repo structure <span class="tag tag--medium">Medium</span></article>
        </section>

        <section class="kanban__column" data-status="progress">
          <h3>In Progress <span class="kanban__count">0</span></h3>
          <article class="kanban__card">Build dashboard grid <span class="tag tag--medium">Medium</span></article>
        </section>

        <section class="kanban__column" data-status="done">
          <h3>Completed <span class="kanban__count">0</span></h3>
          <article class="kanban__card">Project synopsis <span class="tag tag--low">Low</span></article>
        </section>
      </main>
    </div>
  </div>

  <div class="modal" id="new-task-modal">
    <div class="modal__box">
      <div class="modal__header">
        <h3>New Task</h3>
        <button class="modal__close" data-modal-close aria-label="Close">&times;</button>
      </div>
      <form id="task-form" novalidate>
        <div class="form-group">
          <label for="task-title">Task Title</label>
          <input type="text" id="task-title" placeholder="e.g. Write README">
          <span id="task-error" class="form-error"></span>
        </div>
        <div class="form-group">
          <label for="task-priority">Priority</label>
          <select id="task-priority">
            <option value="high">High</option>
            <option value="medium" selected>Medium</option>
            <option value="low">Low</option>
          </select>
        </div>
        <button type="submit" class="btn btn--primary">Add Task</button>
      </form>
    </div>
  </div>

  <footer class="site-footer">
    <p>&copy; 2026 CollabHub — GLA University Project</p>
  </footer>

  <script src="../js/nav-toggle.js"></script>
  <script src="../js/modal.js"></script>
  <script src="../js/kanban-interactions.js"></script>
</body>
</html>
