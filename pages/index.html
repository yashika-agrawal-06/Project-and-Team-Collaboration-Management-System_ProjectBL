<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Project &amp; Team Collaboration System</title>
  <link rel="stylesheet" href="../css/global.css">
</head>
<body>
  <header class="site-header">
    <h1 class="site-header__logo">CollabHub</h1>
  </header>

  <main class="auth">
    <section class="auth__card">
      <h2>Welcome Back</h2>
      <form class="auth__form" novalidate>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required placeholder="you@example.com">

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required placeholder="Password">

        <button type="submit" class="btn btn--primary">Log In</button>
      </form>
      <p class="auth__link"><a href="dashboard.html">Skip to Dashboard (prototype)</a></p>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 CollabHub - GLA University Project</p>
  </footer>
</body>
</html>
