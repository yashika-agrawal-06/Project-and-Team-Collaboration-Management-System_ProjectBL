<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Project &amp; Team Collaboration System</title>
  <link rel="stylesheet" href="../css/global.css">
</head>
<body>
  <header class="site-header">
    <h1 class="site-header__logo">CollabHub</h1>
  </header>

  <main class="auth">
    <section class="auth__card">
      <h2>Welcome Back</h2>
      <div id="google-signin-btn" class="btn-google"></div>
      <p id="google-signin-message" class="auth__message" role="status" aria-live="polite"></p>
      <div class="auth__divider"><span>or continue with email</span></div>

      <form class="auth__form" data-validate data-redirect="dashboard.html" novalidate>
        <div class="form-field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required placeholder="you@example.com">
          <span class="form-error"></span>
        </div>

        <div class="form-field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required placeholder="Min 6 characters">
          <span class="form-error"></span>
        </div>

        <button type="submit" class="btn btn--primary">Log In</button>
      </form>

      <div class="auth__help-links">
        <a href="#">Forgot password?</a>
        <p>Don't have an account? <a href="#">Sign up</a></p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 CollabHub — GLA University Project</p>
  </footer>

  <script src="../js/auth.js"></script>
  <script src="../js/validation.js"></script>
</body>
</html>
