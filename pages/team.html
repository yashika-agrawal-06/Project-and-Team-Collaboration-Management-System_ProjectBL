
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team | CollabHub</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/navbar.css">
</head>
<body>
  <header class="navbar" id="main-navbar">
    <button class="navbar__toggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="mobile-sidebar">&#9776;</button>
    <a href="dashboard.html" class="navbar__brand">CollabHub</a>
    <nav class="navbar__nav" role="navigation" aria-label="Main navigation">
      <a href="dashboard.html" class="navbar__link">Dashboard</a>
      <a href="kanban.html" class="navbar__link">Task Board</a>
      <a href="team.html" class="navbar__link navbar__link--active">Team</a>
      <a href="settings.html" class="navbar__link">Settings</a>
    </nav>
    <button class="navbar__profile" type="button" aria-label="Profile menu">Yashika</button>
  </header>

  <!-- Mobile drawer -->
  <aside class="sidebar" id="mobile-sidebar" aria-label="Mobile navigation">
    <ul class="sidebar__list">
      <li><a href="dashboard.html">Dashboard</a></li>
      <li><a href="kanban.html">Task Board</a></li>
      <li><a href="team.html">Team</a></li>
      <li><a href="settings.html">Settings</a></li>
      <li><a href="index.html" data-google-signout>Sign out</a></li>
    </ul>
  </aside>
  <div class="sidebar__overlay" id="sidebar-overlay" aria-hidden="true"></div>

  <main class="team-page" role="main">
    <section class="card">
      <h2>Add Team Member</h2>
      <form class="team-form" data-validate novalidate>
        <div class="form-field">
          <label for="member-name">Name</label>
          <input type="text" id="member-name" required placeholder="Full name">
          <span class="form-error"></span>
        </div>
        <div class="form-field">
          <label for="member-role">Role</label>
          <input type="text" id="member-role" required placeholder="e.g. Tester">
          <span class="form-error"></span>
        </div>
        <button type="submit" class="btn btn--primary">Add Member</button>
      </form>
    </section>

    <section>
      <h2>Team Members (<span id="team-total">0</span>)</h2>
      <div class="team-grid" id="team-list"></div>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 CollabHub — GLA University Project</p>
  </footer>

  <script src="../js/nav-toggle.js"></script>
  <script src="../js/validation.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/team.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
