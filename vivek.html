<!DOCTYPE html>
<html lang="en">

  <link rel="stylesheet" href="style.css">
</head>

<body>
  cursor: grab;
}

</style>
<body>
  <header class="navbar">
    <div class="navbar__brand">CollabHub</div>
    <nav class="navbar__nav">
      <a href="dashboard.html" class="navbar__link">Dashboard</a>
      <a href="kanban.html" class="navbar__link navbar__link--active">Task Board</a>
      <a href="settings.html" class="navbar__link">Settings</a>
    </nav>
    <button class="btn btn--primary">+ New Task</button>
  </header>

  <main class="kanban">
    <section class="kanban__column">
      <h3>To-Do</h3>
      <article class="kanban__card" draggable="true">Design login page</article>
      <article class="kanban__card" draggable="true">Set up repo structure</article>
    </section>

    <section class="kanban__column">
      <h3>In Progress</h3>
      <article class="kanban__card" draggable="true">Build dashboard grid</article>
    </section>

    <section class="kanban__column">
      <h3>Completed</h3>
      <article class="kanban__card" draggable="true">Project synopsis</article>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 CollabHub — GLA University Project</p>
  </footer>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      let dragged = null;

      document.querySelectorAll('.kanban__card').forEach(card => {
        // ensure draggable (some browsers require the attribute)
        card.setAttribute('draggable', 'true');

        card.addEventListener('dragstart', (e) => {
          dragged = card;
          card.classList.add('dragging');
          try { e.dataTransfer.setData('text/plain', ''); } catch (err) {}
        });

        card.addEventListener('dragend', () => {
          if (dragged) dragged.classList.remove('dragging');
          dragged = null;
        });
      });

      document.querySelectorAll('.kanban__column').forEach(col => {
        col.addEventListener('dragover', (e) => {
          e.preventDefault();
          col.classList.add('drag-over');
          const afterElement = getDragAfterElement(col, e.clientY);
          if (!dragged) return;
          if (afterElement == null) {
            col.appendChild(dragged);
          } else {
            col.insertBefore(dragged, afterElement);
          }
        });

        col.addEventListener('dragleave', () => col.classList.remove('drag-over'));
        col.addEventListener('drop', (e) => { e.preventDefault(); col.classList.remove('drag-over'); });
      });

      function getDragAfterElement(container, y) {
        const draggableElements = [...container.querySelectorAll('.kanban__card:not(.dragging)')];

        return draggableElements.reduce((closest, child) => {
          const box = child.getBoundingClientRect();
          const offset = y - box.top - box.height / 2;
          if (offset < 0 && offset > closest.offset) {
            return { offset: offset, element: child };
          } else {
            return closest;
          }
        }, { offset: Number.NEGATIVE_INFINITY }).element || null;
      }
    });
  </script>
</body>
</html>
